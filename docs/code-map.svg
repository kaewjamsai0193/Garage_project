<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1492" viewBox="0 0 1600 1492" role="img" aria-labelledby="t d">
<title id="t">อยากแก้เรื่องนี้ ไปเปิดไฟล์ไหน</title>
<desc id="d">โค้ดที่มีตอนนี้: ทุกคำขอเดินจากหน้าจอ ผ่าน api.js และ Vite ไป router, service และฐานข้อมูล ตารางไล่ทีละหน้าจอว่าเรียก URL ไหน ฟังก์ชันไหนทำงานจริง และแตะตารางไหน</desc>
